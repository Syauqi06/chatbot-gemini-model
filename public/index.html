<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IEL — Asisten IELTS</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <main class="container">
    <header class="chat-header">
      <div class="brand-mark" aria-hidden="true">IEL</div>
      <div class="header-copy">
        <h1>Asisten IELTS</h1>
        <p class="subtitle">Teman latihan dan persiapan IELTS Anda</p>
      </div>
      <span class="online-status">Siap membantu</span>
    </header>
    <div id="chat-box" class="chat-box" aria-live="polite" aria-label="Percakapan"></div>
    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Tulis pesan Anda..." autocomplete="off" aria-label="Pesan Anda" required />
      <button type="submit">Kirim</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
